name: Coach notifications

on:
  schedule:
    # GitHub Actions usa UTC. Estes horários equivalem a 08h, 11h, 15h e 19h em São Paulo.
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Horário do Coach para testar
        required: true
        default: "8"
        type: choice
        options:
          - "8"
          - "11"
          - "15"
          - "19"

permissions:
  contents: read

concurrency:
  group: coach-notifications-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Selecionar horário de São Paulo
        id: schedule
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          case "$EVENT_SCHEDULE" in
            "0 11 * * *") slot=8 ;;
            "0 14 * * *") slot=11 ;;
            "0 18 * * *") slot=15 ;;
            "0 22 * * *") slot=19 ;;
            *) slot="$MANUAL_SLOT" ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Enviar insights e motivações
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLOT: ${{ steps.schedule.outputs.slot }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://hevy-analyzer-2.vercel.app/api/cron/notifications?slot=$SLOT"
